name = "botw"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Screenshots are cleared out a month after a challenge ends; see SHOT_RETENTION_DAYS. Daily is plenty
# for something measured in months, and 04:00 UTC is the small hours in Britain and the quiet end of
# the evening in Australia.
[triggers]
crons = ["0 4 * * *"]

# Created with `wrangler d1 create botw`. The id comes from `wrangler d1 list` if it is ever lost.
[[d1_databases]]
binding = "DB"
database_name = "botw"
database_id = "804be076-0326-40bf-84bd-a24f958ac48d"
