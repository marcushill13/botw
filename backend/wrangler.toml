name = "botw"
main = "src/index.js"
compatibility_date = "2026-01-01"

# One Cron Trigger serves the Discord board each minute and prunes expired screenshots
# at 04:00 UTC. This fits the Workers Free per-account trigger limit.
[triggers]
crons = ["* * * * *"]

# Created with `wrangler d1 create botw`. The id comes from `wrangler d1 list` if it is ever lost.
[[d1_databases]]
binding = "DB"
database_name = "botw"
database_id = "804be076-0326-40bf-84bd-a24f958ac48d"
